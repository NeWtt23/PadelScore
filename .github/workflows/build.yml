name: Compilar IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar proyecto de Xcode
        run: xcodegen generate

      - name: Compilar
        run: |
          xcodebuild -project PadelScore.xcodeproj -scheme PadelScore \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PadelScore.app Payload/
          zip -r PadelScore.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PadelScore-ipa
          path: PadelScore.ipa
